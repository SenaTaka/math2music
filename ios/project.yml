name: Math2Music
options:
  bundleIdPrefix: com.senatakasawa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  Atomics:
    url: https://github.com/apple/swift-atomics
    from: 1.2.0
targets:
  Math2Music:
    type: application
    platform: iOS
    sources:
      - Math2Music
    dependencies:
      - package: Atomics
        product: Atomics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senatakasawa.math2music
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6325NASDSP
    info:
      path: Math2Music/Info.plist
      properties:
        CFBundleDisplayName: Math2Music
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryAddUsageDescription: "生成したループ動画を写真ライブラリに保存するために使用します。 / Used to save generated loop videos to your photo library."
        ITSAppUsesNonExemptEncryption: false
